# Tools `repoke init` offers on a fresh machine. `via` maps a manager id to the package name it
# uses; `brew-cask` is a Homebrew cask. The first manager present on the machine, in the order of
# `repoke list`, is the one used.

[[tool]]
id = "git"
category = "Git"
description = "Version control"
via = { brew = "git", apt = "git", dnf = "git", pacman = "git", zypper = "git", winget = "Git.Git", scoop = "git", choco = "git" }

[[tool]]
id = "gh"
category = "Git"
description = "GitHub from the command line"
via = { brew = "gh", dnf = "gh", pacman = "github-cli", winget = "GitHub.cli", scoop = "gh", choco = "gh" }

[[tool]]
id = "lazygit"
category = "Git"
description = "Terminal UI for git"
via = { brew = "lazygit", pacman = "lazygit", winget = "JesseDuffield.lazygit", scoop = "lazygit" }

[[tool]]
id = "delta"
category = "Git"
description = "Syntax-highlighted diffs for git"
via = { brew = "git-delta", dnf = "git-delta", pacman = "git-delta", winget = "dandavison.delta", scoop = "delta" }

