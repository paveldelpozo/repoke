[package]
name = "repoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Finds the package managers on your system and keeps them up to date, interactively or unattended"
authors = ["Pavel del Pozo"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/paveldelpozo/repoke"
readme = "README.md"
keywords = ["package-manager", "update", "upgrade", "cli", "homebrew"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*", "/build.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
indicatif = "0.18.6"
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
