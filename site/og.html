<!doctype html>
<!-- Source of og.png and og-es.png (1200×630, the size social networks crop to); site/og.sh renders it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FBF9F4;
    color: #17140F;
    display: grid;
    grid-template-columns: 470px 1fr;
    align-items: center;
    padding: 0 80px 0 60px;
    box-sizing: border-box;
  }
  img { width: 470px; }
  h1 {
    font: 700 132px/1 "Iowan Old Style", Palatino, Georgia, serif;
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }
  p { font: 400 38px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 0 0 44px; }
  code { font: 500 30px/1 ui-monospace, Menlo, monospace; color: #B3121F; }
</style>
</head>
<body>
  <img src="public/logo.svg" alt="">
  <div>
    <h1>repoke</h1>
    <p id="lead"></p>
    <code>repoke.paveldelpozo.es</code>
  </div>
  <script>
    document.getElementById("lead").textContent = location.hash === "#es"
      ? "Todos tus gestores de paquetes, un solo comando."
      : "Every package manager on your machine, one command.";
  </script>
</body>
</html>
