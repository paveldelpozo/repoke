server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects keep the scheme and host the visitor used: behind the TLS proxy, /es goes to /es/ and stays on https.
  absolute_redirect off;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml image/x-icon application/xml;

  error_page 404 /404.html;

  # HTML, sitemap.xml and robots.txt change on every deploy: always revalidate (ETag makes it a cheap 304).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  location /es/ {
    add_header Cache-Control "no-cache";
    error_page 404 /es/404.html;
    try_files $uri $uri/ =404;
  }

  # Astro puts content-hashed bundles here, so they can never change under the same name.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Assets from public/ keep fixed names (style.css, og.png, favicons), so a day only.
  location ~* \.(css|js|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
}
