<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="alternate" hreflang="en" href="{{url_en}}">
  <link rel="alternate" hreflang="es" href="{{url_es}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Before the first paint: the saved theme, and the language (saved, else the browser's).
    (function () {
      var root = document.documentElement, theme, lang;
      try { theme = localStorage.getItem("theme"); lang = localStorage.getItem("lang"); } catch (e) {}
      if (theme === "light" || theme === "dark") root.dataset.theme = theme;
      if (!lang) {
        lang = (navigator.languages || [navigator.language || ""])
          .map(function (l) { return String(l).slice(0, 2).toLowerCase(); })
          .filter(function (l) { return l === "en" || l === "es"; })[0] || "en";
      }
      if (lang !== root.lang) {
        var other = document.querySelector('link[rel="alternate"][hreflang="' + lang + '"]');
        if (other) location.replace(other.getAttribute("href") + location.hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
  <script src="/site.js" defer></script>
</head>
<body data-copy="{{copy}}" data-copied="{{copied}}" data-copy-failed="{{copy_failed}}">
  <a class="skip" href="#main">{{skip}}</a>
  <header class="top">
    <a class="brand" href="{{home}}" aria-label="{{home_label}}">
      <img src="/logo.svg" alt="" width="66" height="44">
      <span>repoke</span>
    </a>
    <div class="prefs">
      <label class="visually-hidden" for="lang">{{language}}</label>
      <select id="lang" class="pref">
        <option value="{{url_en}}" lang="en"{{selected_en}}>English</option>
        <option value="{{url_es}}" lang="es"{{selected_es}}>Español</option>
      </select>
      <label class="visually-hidden" for="theme">{{theme}}</label>
      <select id="theme" class="pref">
        <option value="system">{{theme_system}}</option>
        <option value="light">{{theme_light}}</option>
        <option value="dark">{{theme_dark}}</option>
      </select>
    </div>
    <nav aria-label="{{nav_label}}">
{{nav}}
    </nav>
  </header>

  <main id="main"{{main_class}}>
{{content}}
  </main>

  <footer>
    <p>{{footer}}</p>
    <p><a href="https://github.com/paveldelpozo/repoke">{{source}}</a> <span aria-hidden="true">·</span> <a href="https://github.com/paveldelpozo/repoke/releases">Releases</a> <span aria-hidden="true">·</span> <a href="https://crates.io/crates/repoke">crates.io</a> <span aria-hidden="true">·</span> <a href="https://github.com/paveldelpozo/repoke-plugins">{{plugins}}</a></p>
  </footer>
</body>
</html>
